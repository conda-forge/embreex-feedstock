schema_version: 1

context:
  version: "4.4.0.post1"

package:
  name: embreex
  version: ${{ version }}

source:
  url: https://github.com/trimesh/embreex/archive/refs/tags/${{ version }}.tar.gz
  sha256: 214960eab9e7d070b845afb1f3b9d5178ce4108c4e8d6b54bc2932f63a8809c2

build:
  number: 0
  script: python -m pip install --no-deps --no-build-isolation -vv .

requirements:
  build:
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
        - python
        - cython
        - numpy
        - embree
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - setuptools
    - pip
    - embree
    - cython
    - numpy
  run:
    - python
    - embree
    - numpy

tests:
  - python:
      imports:
        - embreex
      pip_check: true

about:
  homepage: https://github.com/trimesh/embreex
  repository: https://github.com/trimesh/embreex
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Fork of pyembree that supports newer versions of Python and embree
  description: |
    Fork of pyembree that supports newer versions of Python and embree
  documentation: https://github.com/trimesh/embreex

extra:
  recipe-maintainers:
    - langmm
